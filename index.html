<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PayPlan</title>
  <style>
    :root {
      --navy: #173B57;
      --light-blue: #EAF3F8;
      --black: #17212B;
      --teal: #24A88A;
      --background: #F5F8FA;
      --white: #FFFFFF;
      --muted: #647482;
      --border: #DCE5EB;
      --orange: #F2A541;
      --red: #C94C4C;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--background);
      color: var(--black);
      font-family: Arial, sans-serif;
    }

    header {
      background: var(--navy);
      color: var(--white);
      padding: 18px max(16px, calc((100% - 1000px) / 2));
    }

    header h1 { margin: 0; }
    header p { margin: 5px 0 0; color: #D7E7F0; }

    main {
      max-width: 1000px;
      margin: 22px auto;
      padding: 0 16px 100px;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      gap: 6px;
      overflow-x: auto;
      padding: 9px;
      background: var(--white);
      border-top: 1px solid var(--border);
    }

    nav button {
      flex: 0 0 auto;
      padding: 10px 13px;
      border: 0;
      border-radius: 9px;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
    }

    nav button.active {
      background: var(--light-blue);
      color: var(--navy);
      font-weight: bold;
    }

    h2 { color: var(--navy); }
    h3 { margin-top: 0; color: var(--navy); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
      margin-bottom: 16px;
    }

    .card, .form-card {
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--white);
      box-shadow: 0 3px 12px #173b570c;
      margin-bottom: 14px;
    }

    .metric { margin: 8px 0; font-size: 1.8rem; font-weight: bold; }
    .muted { color: var(--muted); font-size: .92rem; }
    .teal { color: var(--teal); }
    .orange { color: #A96500; }
    .red { color: var(--red); }

    .item {
      padding: 13px 0;
      border-bottom: 1px solid var(--border);
    }
    .item:last-child { border-bottom: 0; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    form { display: grid; gap: 12px; }

    label {
      display: grid;
      gap: 6px;
      font-size: .92rem;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 11px;
      border: 1px solid #C8D4DC;
      border-radius: 8px;
      background: var(--white);
      color: var(--black);
      font: inherit;
    }

    .checkbox {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: normal;
    }
    .checkbox input { width: auto; }

    button.action {
      padding: 11px 14px;
      border: 0;
      border-radius: 8px;
      background: var(--navy);
      color: var(--white);
      cursor: pointer;
      font-weight: bold;
    }

    button.secondary {
      padding: 9px 11px;
      border: 0;
      border-radius: 8px;
      background: var(--light-blue);
      color: var(--navy);
      cursor: pointer;
      font-weight: bold;
    }

    button.delete {
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: #FFF0F0;
      color: var(--red);
      cursor: pointer;
    }

    .notice {
      padding: 12px;
      margin-bottom: 14px;
      border: 1px solid #F3D69F;
      border-radius: 10px;
      background: #FFF6E8;
    }

    .empty { padding: 10px 0; color: var(--muted); }

    @media (max-width: 600px) {
      nav { justify-content: flex-start; }
      .row { align-items: flex-start; }
    }
  </style>
</head>
<body>
  <header>
    <h1>PayPlan</h1>
    <p>Organiza tus ingresos, deudas y pagos.</p>
  </header>

  <main id="app"></main>
  <nav id="nav"></nav>

  <script>
    const STORAGE_KEY = "payplan-confirmed-payments-v1";
    const pages = [
      ["home", "Inicio"],
      ["debts", "Deudas"],
      ["income", "Ingresos"],
      ["payments", "Pagos"],
      ["calendar", "Calendario"],
      ["help", "Ayuda"]
    ];

    let page = "home";
    let data = loadData();

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) ||
          { debts: [], incomes: [], payments: [] };
      } catch {
        return { debts: [], incomes: [], payments: [] };
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    function makeId() {
      return crypto.randomUUID
        ? crypto.randomUUID()
        : String(Date.now() + Math.random());
    }

    function escapeHTML(value = "") {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;",
        '"': "&quot;", "'": "&#039;"
      }[char]));
    }

    function money(value) {
      return new Intl.NumberFormat("es", {
        style: "currency",
        currency: "USD"
      }).format(Number(value) || 0);
    }

    function localDate(value) {
      if (!value) return null;
      const [year, month, day] = value.split("-").map(Number);
      return new Date(year, month - 1, day);
    }

    function today() {
      const now = new Date();
      return [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0")
      ].join("-");
    }

    function formatDate(value) {
      const date = localDate(value);
      return date ? date.toLocaleDateString("es", {
        day: "numeric", month: "short", year: "numeric"
      }) : "Sin fecha";
    }

    function daysUntil(value) {
      const due = localDate(value);
      if (!due) return Infinity;
      const now = localDate(today());
      return Math.round((due - now) / 86400000);
    }

    function remaining(debt) {
      const paid = data.payments
        .filter(payment => payment.debtId === debt.id)
        .reduce((sum, payment) => sum + Number(payment.amount), 0);
      return Math.max(0, Number(debt.amount) - paid);
    }

    function activeDebts() {
      return data.debts
        .filter(debt => remaining(debt) > 0)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    }

    function availableMoney() {
      const received = data.incomes
        .filter(income => income.received)
        .reduce((sum, income) => sum + Number(income.amount), 0);
      const paid = data.payments
        .reduce((sum, payment) => sum + Number(payment.amount), 0);
      return received - paid;
    }

    function dueText(debt) {
      const days = daysUntil(debt.dueDate);
      if (days < 0) return `Venció hace ${Math.abs(days)} día(s)`;
      if (days === 0) return "Vence hoy";
      return `Vence en ${days} día(s)`;
    }

    function renderNav() {
      document.getElementById("nav").innerHTML = pages.map(([key, label]) =>
        `<button class="${page === key ? "active" : ""}" data-page="${key}">${label}</button>`
      ).join("");
    }

    function renderHome() {
      const debts = activeDebts();
      const next = debts[0];
      const soon = debts.filter(debt => {
        const days = daysUntil(debt.dueDate);
        return days >= 0 && days <= 5;
      });

      return `
        <h2>Inicio</h2>
        ${soon.length ? `<div class="notice">🔔 ${soon.length} pago(s) vencen dentro de los próximos 5 días.</div>` : ""}
        <div class="grid">
          <section class="card">
            <div class="muted">Dinero recibido disponible</div>
            <div class="metric teal">${money(availableMoney())}</div>
            <div class="muted">Solo cuenta ingresos marcados como recibidos.</div>
          </section>
          <section class="card">
            <div class="muted">Próximo vencimiento</div>
            ${next ? `
              <div class="metric orange">${money(remaining(next))}</div>
              <strong>${escapeHTML(next.name)}</strong>
              <div class="muted">${dueText(next)} · ${formatDate(next.dueDate)}</div>
            ` : `<p class="empty">No tienes deudas pendientes.</p>`}
          </section>
        </div>

        <section class="card">
          <h3>Orden recomendado</h3>
          ${debts.length ? debts.map(debt => `
            <div class="item row">
              <div>
                <strong>${escapeHTML(debt.name)}</strong>
                <div class="muted">${dueText(debt)} · ${formatDate(debt.dueDate)}</div>
              </div>
              <strong>${money(remaining(debt))}</strong>
            </div>
          `).join("") : `<p class="empty">Agrega una deuda para ver tu plan.</p>`}
          <p class="muted">El orden se basa en la fecha de vencimiento. Revisa las cuotas mínimas de tus deudas.</p>
        </section>`;
    }

    function renderDebts() {
      const debts = activeDebts();
      return `
        <h2>Mis deudas</h2>
        <div class="grid">
          <section class="form-card">
            <h3>Agregar deuda</h3>
            <form id="debtForm">
              <label>Nombre de la deuda
                <input name="name" required placeholder="Ej. Tarjeta de crédito">
              </label>
              <label>Monto pendiente ($)
                <input name="amount" type="number" min="0.01" step="0.01" required>
              </label>
              <label>Pago mínimo sugerido ($), opcional
                <input name="minimum" type="number" min="0" step="0.01">
              </label>
              <label>Fecha de vencimiento
                <input name="dueDate" type="date" required>
              </label>
              <button class="action">Guardar deuda</button>
            </form>
          </section>

          <section class="card">
            <h3>Deudas por vencer</h3>
            ${debts.length ? debts.map(debt => `
              <div class="item">
                <div class="row">
                  <strong>${escapeHTML(debt.name)}</strong>
                  <strong>${money(remaining(debt))}</strong>
                </div>
                <div class="muted">${dueText(debt)} · ${formatDate(debt.dueDate)}</div>
                ${debt.minimum ? `<div class="muted">Pago mínimo indicado: ${money(debt.minimum)}</div>` : ""}
              </div>
            `).join("") : `<p class="empty">Todavía no agregas deudas.</p>`}
          </section>
        </div>`;
    }

    function renderIncome() {
      const incomes = [...data.incomes].sort((a, b) => a.date.localeCompare(b.date));
      return `
        <h2>Mis ingresos</h2>
        <div class="grid">
          <section class="form-card">
            <h3>Agregar ingreso</h3>
            <form id="incomeForm">
              <label>Descripción
                <input name="name" required placeholder="Ej. Pago del trabajo">
              </label>
              <label>Monto ($)
                <input name="amount" type="number" min="0.01" step="0.01" required>
              </label>
              <label>Fecha de pago
                <input name="date" type="date" required>
              </label>
              <label class="checkbox">
                <input name="received" type="checkbox">
                Ya recibí este dinero
              </label>
              <button class="action">Guardar ingreso</button>
            </form>
            <p class="muted">Un ingreso futuro aparece en el calendario, pero no se cuenta como dinero disponible hasta marcarlo recibido.</p>
          </section>

          <section class="card">
            <h3>Ingresos registrados</h3>
            ${incomes.length ? incomes.map(income => `
              <div class="item row">
                <div>
                  <strong>${escapeHTML(income.name)}</strong>
                  <div class="muted">${formatDate(income.date)} · ${income.received ? "Recibido" : "Programado"}</div>
                </div>
                <strong class="${income.received ? "teal" : ""}">${money(income.amount)}</strong>
              </div>
            `).join("") : `<p class="empty">Aún no has registrado ingresos.</p>`}
          </section>
        </div>`;
    }

    function renderPayments() {
      const debts = activeDebts();
      const payments = [...data.payments].sort((a, b) => b.date.localeCompare(a.date));

      return `
        <h2>Registrar pago</h2>
        <div class="grid">
          <section class="form-card">
            <h3>Nuevo pago</h3>
            ${debts.length ? `
              <form id="paymentForm">
                <label>Deuda
                  <select name="debtId" required>
                    ${debts.map(debt => `
                      <option value="${debt.id}">
                        ${escapeHTML(debt.name)} — saldo ${money(remaining(debt))}
                      </option>
                    `).join("")}
                  </select>
                </label>
                <label>Monto pagado ($)
                  <input name="amount" type="number" min="0.01" step="0.01" required>
                </label>
                <label>Fecha del pago
                  <input name="date" type="date" value="${today()}" required>
                </label>
                <button class="action">Registrar pago</button>
              </form>
            ` : `<p class="empty">No tienes deudas pendientes para pagar.</p>`}
          </section>

          <section class="card">
            <h3>Historial de pagos</h3>
            ${payments.length ? payments.map(payment => {
              const debt = data.debts.find(item => item.id === payment.debtId);
              return `
                <div class="item row">
                  <div>
                    <strong>${escapeHTML(debt?.name || "Deuda")}</strong>
                    <div class="muted">Pago confirmado · ${formatDate(payment.date)}</div>
                  </div>
                  <strong class="teal">${money(payment.amount)}</strong>
                </div>`;
            }).join("") : `<p class="empty">Todavía no hay pagos registrados.</p>`}
          </section>
        </div>`;
    }

    function renderCalendar() {
      const events = [
        ...activeDebts().map(debt => ({
          date: debt.dueDate,
          name: debt.name,
          amount: remaining(debt),
          type: "Vencimiento"
        })),
        ...data.incomes.map(income => ({
          date: income.date,
          name: income.name,
          amount: Number(income.amount),
          type: income.received ? "Ingreso recibido" : "Ingreso programado"
        }))
      ].sort((a, b) => a.date.localeCompare(b.date));

      return `
        <h2>Calendario</h2>
        <section class="card">
          <h3>Fechas importantes</h3>
          ${events.length ? events.map(event => `
            <div class="item row">
              <div>
                <strong>${escapeHTML(event.name)}</strong>
                <div class="muted">${event.type} · ${formatDate(event.date)}</div>
              </div>
              <strong>${money(event.amount)}</strong>
            </div>
          `).join("") : `<p class="empty">Agrega ingresos o deudas para ver sus fechas.</p>`}
        </section>`;
    }

    function renderHelp() {
      return `
        <h2>Ayuda</h2>
        <section class="card">
          <h3>Cómo registrar un pago</h3>
          <ol>
            <li>Agrega la deuda en la sección <strong>Deudas</strong>.</li>
            <li>Abre <strong>Pagos</strong> y selecciona esa deuda.</li>
            <li>Escribe el monto y la fecha del pago.</li>
            <li>Presiona <strong>Registrar pago</strong> y confirma.</li>
          </ol>
          <p>Al confirmar, el pago queda en el historial y se resta del saldo pendiente de la deuda.</p>
          <p class="muted">PayPlan registra tus pagos; no transfiere dinero ni paga a tus acreedores.</p>
          <button class="delete" id="clearData">Borrar todos los datos de este navegador</button>
        </section>`;
    }

    function render() {
      renderNav();
      const renderers = {
        home: renderHome,
        debts: renderDebts,
        income: renderIncome,
        payments: renderPayments,
        calendar: renderCalendar,
        help: renderHelp
      };
      document.getElementById("app").innerHTML = renderers[page]();
    }

    document.addEventListener("click", event => {
      const pageButton = event.target.closest("[data-page]");
      if (pageButton) {
        page = pageButton.dataset.page;
        render();
      }

      if (event.target.id === "clearData" &&
          confirm("¿Seguro que quieres borrar todas tus deudas, ingresos y pagos?")) {
        data = { debts: [], incomes: [], payments: [] };
        saveData();
        page = "home";
        render();
      }
    });

    document.addEventListener("submit", event => {
      event.preventDefault();
      const form = event.target;
      const values = Object.fromEntries(new FormData(form));

      if (form.id === "debtForm") {
        data.debts.push({
          id: makeId(),
          name: values.name.trim(),
          amount: Number(values.amount),
          minimum: Number(values.minimum) || 0,
          dueDate: values.dueDate
        });
        saveData();
        render();
      }

      if (form.id === "incomeForm") {
        data.incomes.push({
          id: makeId(),
          name: values.name.trim(),
          amount: Number(values.amount),
          date: values.date,
          received: form.elements.received.checked
        });
        saveData();
        render();
      }

      if (form.id === "paymentForm") {
        const debt = data.debts.find(item => item.id === values.debtId);
        const amount = Number(values.amount);

        if (!debt || amount <= 0 || amount > remaining(debt)) {
          alert("El monto debe ser mayor que cero y no superar el saldo pendiente.");
          return;
        }

        const approved = confirm(
          `¿Confirmas este pago de ${money(amount)} para "${debt.name}"?`
        );

        if (!approved) return;

        data.payments.push({
          id: makeId(),
          debtId: debt.id,
          amount,
          date: values.date
        });

        saveData();
        alert(`Pago confirmado. Saldo pendiente: ${money(remaining(debt))}`);
        render();
      }
    });

    render();
  </script>
</body>
</html>

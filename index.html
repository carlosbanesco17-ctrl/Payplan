<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2457e6">
  <meta name="description" content="Organiza tus deudas, fechas de vencimiento y pagos con PayPlan.">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>PayPlan — Deudas y pagos</title>
  <style>
    :root{color-scheme:light;--blue:#2457e6;--blue-dark:#173db5;--sky:#e7f4ff;--ink:#101828;--muted:#65748b;--bg:#f4f7fc;--white:#fff;--line:#e3eaf3;--teal:#0c9b83;--teal-bg:#e4f8f3;--gold:#985700;--gold-bg:#fff3da;--red:#b83232;--red-bg:#fff0f0;--purple:#7653d6;--purple-bg:#f0ebff;--shadow:0 10px 28px rgba(27,55,110,.08);--radius:18px}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:radial-gradient(ellipse at 85% 0%,#dceeff 0,transparent 34rem),var(--bg);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{color:#fff;background:linear-gradient(115deg,#173db5,#2457e6 58%,#19a1dc);padding:13px 17px}.header-inner{max-width:1120px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:10px}.brand svg{width:46px;height:46px;flex:none}.brand h1{margin:0;font-size:1.2rem}.brand p{margin:2px 0 0;color:#e3f2ff;font-size:.8rem}#today{font-size:.82rem;white-space:nowrap}main{max-width:1120px;min-height:calc(100vh - 130px);margin:auto;padding:23px 16px 105px}h2{margin:0;font-size:clamp(1.45rem,3vw,1.9rem);letter-spacing:-.04em}h3{margin:0 0 13px;font-size:1.03rem}.subtitle{margin:5px 0 0;color:var(--muted);font-size:.92rem;line-height:1.5}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:17px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-bottom:15px}.columns{display:grid;grid-template-columns:1fr 1.2fr;gap:15px;align-items:start}.card,.form-card{padding:18px;background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.metric-label{color:var(--muted);font-size:.86rem;font-weight:650}.metric{margin:8px 0 3px;font-size:1.75rem;font-weight:850;letter-spacing:-.04em}.blue{color:var(--blue)}.teal{color:var(--teal)}.gold{color:var(--gold)}.purple{color:var(--purple)}.muted{color:var(--muted);font-size:.86rem;line-height:1.5}.welcome{position:relative;overflow:hidden;padding:20px;border-radius:var(--radius);color:#fff;background:linear-gradient(120deg,#1d46c5,#2875ee 68%,#20a6d8);box-shadow:0 12px 28px #2457e633;margin-bottom:15px}.welcome:after{content:"✓";position:absolute;right:17px;bottom:-38px;color:#ffffff20;font-size:150px;font-weight:900;pointer-events:none}.welcome h2,.welcome p{position:relative;z-index:1}.welcome p{max-width:610px;margin:8px 0 0;color:#e6f3ff;line-height:1.5}.notice{padding:12px 14px;margin-bottom:13px;border:1px solid #f1d08b;border-radius:13px;color:#704500;background:var(--gold-bg);line-height:1.45}.section-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.section-top h3{margin:0}.list{display:grid;gap:9px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;border:1px solid var(--line);border-radius:13px;background:#fff}.item-name{margin-bottom:4px;font-weight:750}.item-info{color:var(--muted);font-size:.83rem;line-height:1.5}.item-actions{display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}.amount{font-weight:800;white-space:nowrap}.badge{display:inline-flex;align-items:center;gap:4px;padding:5px 8px;border-radius:999px;color:var(--blue-dark);background:var(--sky);font-size:.74rem;font-weight:750;white-space:nowrap}.badge.teal{color:#08765f;background:var(--teal-bg)}.badge.gold{color:#875000;background:var(--gold-bg)}.badge.red{color:#a12e2e;background:var(--red-bg)}.badge.purple{color:#6042b3;background:var(--purple-bg)}.primary,.secondary,.danger,.plain{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:41px;padding:9px 13px;border:0;border-radius:11px;font-weight:750;transition:transform .15s,filter .15s}.primary{color:white;background:var(--blue);box-shadow:0 4px 11px #2457e62e}.primary:hover{background:var(--blue-dark);transform:translateY(-1px)}.secondary{color:var(--blue-dark);background:var(--sky)}.danger{color:var(--red);background:var(--red-bg)}.plain{color:var(--ink);background:#f1f5f9}.small{min-height:34px;padding:7px 9px;font-size:.8rem}form{display:grid;gap:11px}label{display:grid;gap:6px;font-size:.86rem;font-weight:700}input,select{width:100%;min-height:42px;padding:9px 11px;border:1px solid #cbd5e1;border-radius:10px;color:var(--ink);background:white}input:focus,select:focus{outline:3px solid #2457e620;border-color:var(--blue)}.empty{padding:17px;border:1px dashed #cbd5e1;border-radius:13px;color:var(--muted);text-align:center;line-height:1.5}.progress-track{height:10px;overflow:hidden;border-radius:99px;background:#e8eef6}.progress-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#12a98b,#55d0aa);transition:width .3s}.progress-caption{display:flex;justify-content:space-between;gap:8px;margin-top:7px;color:var(--muted);font-size:.78rem}.achievement{display:flex;align-items:center;gap:10px;padding:11px;border-radius:13px;color:#5336a5;background:var(--purple-bg)}.achievement-icon{font-size:1.6rem}.achievement strong,.achievement span{display:block}.achievement span{font-size:.8rem}.plan-row{display:grid;grid-template-columns:29px 1fr auto;align-items:center;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}.plan-row:last-child{border-bottom:0}.plan-number{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;color:var(--blue-dark);background:var(--sky);font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.settings-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.settings-row:last-child{border-bottom:0}.file-input{display:none}.toast{position:fixed;left:50%;bottom:88px;z-index:10;max-width:calc(100% - 28px);transform:translateX(-50%);padding:11px 15px;border-radius:12px;color:#fff;background:#172b4d;box-shadow:var(--shadow)}nav{position:fixed;z-index:5;right:0;bottom:0;left:0;display:flex;justify-content:center;gap:3px;padding:7px 8px max(7px,env(safe-area-inset-bottom));overflow-x:auto;border-top:1px solid var(--line);background:#ffffffF5;backdrop-filter:blur(12px)}nav button{display:grid;flex:0 0 auto;justify-items:center;gap:2px;min-width:62px;padding:7px 8px;border:0;border-radius:11px;color:var(--muted);background:transparent;font-size:.7rem}nav button.active{color:var(--blue-dark);background:var(--sky);font-weight:750}nav .icon{font-size:1.08rem}footer{margin-top:16px;text-align:center;color:var(--muted);font-size:.75rem}
    @media(max-width:760px){.grid{grid-template-columns:1fr 1fr}.columns{grid-template-columns:1fr}}
    @media(max-width:520px){main{padding:17px 12px 100px}.grid{grid-template-columns:1fr}.heading{align-items:flex-start;flex-direction:column}.item{align-items:flex-start}.item-actions{flex-direction:column;align-items:flex-end}.brand svg{width:41px;height:41px}#today{font-size:.72rem}.card,.form-card{padding:15px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;transition:none!important}}
  </style>
</head>
<body>
  <header><div class="header-inner">
    <div class="brand">
      <svg viewBox="0 0 100 100" role="img" aria-label="Logo PayPlan"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20c4ad"/><stop offset="1" stop-color="#1677d2"/></linearGradient></defs><rect x="5" y="5" width="90" height="90" rx="22" fill="none" stroke="url(#lg)" stroke-width="8"/><rect x="23" y="53" width="13" height="23" rx="3" fill="url(#lg)"/><rect x="43" y="41" width="13" height="35" rx="3" fill="url(#lg)"/><rect x="63" y="28" width="13" height="48" rx="3" fill="url(#lg)"/><circle cx="69" cy="68" r="13" fill="white" stroke="url(#lg)" stroke-width="4"/><path d="m63 68 4 4 8-9" fill="none" stroke="#1688c9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <div><h1>PayPlan</h1><p>Deudas y pagos, paso a paso</p></div>
    </div><div id="today"></div>
  </div></header>
  <main id="app" aria-live="polite"></main>
  <nav id="nav" aria-label="Navegación principal"></nav>
  <div id="toast" class="toast" role="status" hidden></div>

  <script>
    "use strict";
    const DATA_KEY="payplan-fun-debts-v1", NAME_KEY="payplan-fun-name-v1", CURRENCY_KEY="payplan-currency-v1";
    const tabs=[["home","🏠","Inicio"],["debts","📋","Deudas"],["payments","✅","Pagos"],["calendar","📅","Fechas"],["profile","👤","Perfil"],["help","❔","Ayuda"]];
    let page="home", selectedDebtId="", toastTimer;
    let data=loadData();
    function loadData(){try{const saved=JSON.parse(localStorage.getItem(DATA_KEY));return saved&&Array.isArray(saved.debts)?{debts:saved.debts,payments:Array.isArray(saved.payments)?saved.payments:[]}: {debts:[],payments:[]}}catch{return{debts:[],payments:[]}}}
    function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(data))}
    function makeId(){return crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random())}
    function name(){return localStorage.getItem(NAME_KEY)||""}
    function currency(){return localStorage.getItem(CURRENCY_KEY)||"USD"}
    function esc(value=""){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
    function money(value){try{return new Intl.NumberFormat(undefined,{style:"currency",currency:currency()}).format(Number(value)||0)}catch{return `${Number(value)||0} ${currency()}`}}
    function dateObject(value){if(!value)return null;const [y,m,d]=value.split("-").map(Number);return new Date(y,m-1,d)}
    function todayString(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
    function dateText(value){const d=dateObject(value);return d?d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"Sin fecha"}
    function daysUntil(value){const d=dateObject(value);return d?Math.round((d-dateObject(todayString()))/86400000):Infinity}
    function balance(debt){return Math.max(0,Number(debt.amount)-data.payments.filter(p=>p.debtId===debt.id).reduce((s,p)=>s+Number(p.amount),0))}
    function openDebts(){return [...data.debts].filter(d=>balance(d)>0).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))}
    function totalOriginal(){return data.debts.reduce((s,d)=>s+Number(d.amount),0)}
    function totalRemaining(){return data.debts.reduce((s,d)=>s+balance(d),0)}
    function totalPaid(){return data.payments.reduce((s,p)=>s+Number(p.amount),0)}
    function dueLabel(debt){const n=daysUntil(debt.dueDate);if(n<0)return `Venció hace ${Math.abs(n)} día(s)`;if(n===0)return "Vence hoy";if(n===1)return "Vence mañana";return `Vence en ${n} días`}
    function dueClass(debt){const n=daysUntil(debt.dueDate);return n<0?"red":n<=5?"gold":""}
    function notifyToast(message){const el=document.getElementById("toast");el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2800)}
    function renderNav(){document.getElementById("nav").innerHTML=tabs.map(([key,icon,label])=>`<button type="button" class="${page===key?"active":""}" data-page="${key}" aria-current="${page===key?"page":"false"}"><span class="icon">${icon}</span><span>${label}</span></button>`).join("")}
    function renderHome(){
      const debts=openDebts(), reminders=debts.filter(d=>daysUntil(d.dueDate)>=0&&daysUntil(d.dueDate)<=5), paid=totalPaid(), original=totalOriginal(), progress=original?Math.min(100,Math.round(paid/original*100)):0, points=data.payments.length*10;
      const achievement=data.payments.length>=10?["🏆","¡Imparable!","Ya registraste 10 pagos."]:data.payments.length>=5?["🌟","¡Vas excelente!","Ya registraste 5 pagos."]:data.payments.length?["⚡","¡Buen comienzo!","Cada pago te acerca a tu meta."]:["🎯","Tu primera meta","Registra un pago para empezar tu progreso."];
      return `<section class="welcome"><h2>¡Hola${name()?`, ${esc(name())}`:""}! 👋</h2><p>Organiza tus pagos, sigue tu avance y celebra cada paso hacia tu tranquilidad financiera.</p></section>
        ${reminders.length?`<div class="notice">🔔 <strong>Atención:</strong> ${reminders.length} pago(s) vencen dentro de los próximos 5 días.</div>`:""}
        <div class="grid"><section class="card"><div class="metric-label">Deuda pendiente</div><div class="metric blue">${money(totalRemaining())}</div><div class="muted">${debts.length} deuda(s) pendiente(s)</div></section>
        <section class="card"><div class="metric-label">Total que ya pagaste</div><div class="metric teal">${money(paid)}</div><div class="muted">Cada avance cuenta. ¡Sigue así!</div></section>
        <section class="card"><div class="metric-label">Puntos PayPlan</div><div class="metric purple">⭐ ${points}</div><div class="muted">10 puntos por pago registrado</div></section></div>
        <div class="columns"><section class="card"><div class="section-top"><h3>Tu progreso</h3><span class="badge teal">${progress}% pagado</span></div><div class="progress-track" role="progressbar" aria-label="Porcentaje de deuda pagada" aria-valuenow="${progress}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${progress}%"></div></div><div class="progress-caption"><span>${money(paid)} pagados</span><span>${money(original)} total registrado</span></div><div class="achievement" style="margin-top:15px"><div class="achievement-icon">${achievement[0]}</div><div><strong>${achievement[1]}</strong><span>${achievement[2]}</span></div></div></section>
        <section class="card"><div class="section-top"><h3>Orden de vencimiento</h3><span class="badge">Lo más cercano primero</span></div>${debts.length?debts.slice(0,6).map((d,i)=>`<div class="plan-row"><div class="plan-number">${i+1}</div><div><div class="item-name">${esc(d.name)}</div><div class="item-info"><span class="badge ${dueClass(d)}">${dueLabel(d)}</span> · ${dateText(d.dueDate)}</div></div><strong>${money(balance(d))}</strong></div>`).join(""):`<div class="empty">¡No tienes deudas pendientes! Agrega una para empezar a organizarte.</div>`}<p class="muted">Es una guía por vencimiento, no una recomendación financiera. Verifica los términos con cada acreedor.</p></section></div>
        <section class="card" style="margin-top:15px"><div class="section-top"><h3>Accesos rápidos</h3></div><div class="actions"><button class="primary" data-go="debts">＋ Agregar deuda</button><button class="secondary" data-go="payments">✓ Registrar pago</button><button class="plain" data-go="calendar">📅 Ver fechas</button></div></section>`
    }
    function renderDebts(){const debts=openDebts();return `<div class="heading"><div><h2>Mis deudas</h2><p class="subtitle">Agrega saldos y vencimientos para mantener todo organizado.</p></div></div><div class="columns"><section class="form-card"><h3>＋ Agregar deuda</h3><form id="debtForm"><label>Nombre<input name="name" required maxlength="60" placeholder="Ej. Tarjeta de crédito"></label><label>Categoría<select name="category"><option>Tarjeta</option><option>Préstamo</option><option>Servicio</option><option>Alquiler</option><option>Compra</option><option>Otra</option></select></label><label>Saldo inicial ($)<input name="amount" type="number" min="0.01" step="0.01" required placeholder="50.00"></label><label>Fecha de vencimiento<input name="dueDate" type="date" required></label><label>Nota opcional<input name="note" maxlength="100" placeholder="Ej. número de referencia"></label><button class="primary">Guardar deuda</button></form></section><section class="card"><div class="section-top"><h3>Pendientes</h3><span class="badge">${debts.length}</span></div>${debts.length?`<div class="list">${debts.map(d=>`<div class="item"><div><div class="item-name">${esc(d.name)}</div><div class="item-info"><span class="badge purple">${esc(d.category||"Otra")}</span> <span class="badge ${dueClass(d)}">${dueLabel(d)}</span><div style="margin-top:5px">Vence ${dateText(d.dueDate)} · Saldo <strong>${money(balance(d))}</strong></div>${d.note?`<div>${esc(d.note)}</div>`:""}</div></div><div class="item-actions"><button class="primary small" data-pay="${esc(d.id)}">Registrar pago</button><button class="danger small" data-delete-debt="${esc(d.id)}">Eliminar</button></div></div>`).join("")}</div>`:`<div class="empty">Todavía no agregas deudas.</div>`}</section></div>`}
    function renderPayments(){const debts=openDebts(),payments=[...data.payments].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="heading"><div><h2>Pagos</h2><p class="subtitle">Registra pagos que ya realizaste para actualizar el saldo.</p></div></div><div class="columns"><section class="form-card"><h3>✓ Registrar pago</h3>${debts.length?`<form id="paymentForm"><label>Deuda<select name="debtId" required>${debts.map(d=>`<option value="${esc(d.id)}" ${selectedDebtId===d.id?"selected":""}>${esc(d.name)} — saldo ${money(balance(d))}</option>`).join("")}</select></label><label>Monto pagado<input name="amount" type="number" min="0.01" step="0.01" required placeholder="25.00"></label><label>Fecha<input name="date" type="date" value="${todayString()}" required></label><button class="primary">Guardar pago</button></form><p class="muted">La app no envía dinero; solo lleva tu registro.</p>`:`<div class="empty">No hay deudas pendientes para registrar pagos.</div>`}</section><section class="card"><div class="section-top"><h3>Historial</h3><span class="badge teal">${payments.length}</span></div>${payments.length?`<div class="list">${payments.map(p=>{const d=data.debts.find(x=>x.id===p.debtId);return `<div class="item"><div><div class="item-name">${esc(d?.name||"Deuda")}</div><div class="item-info">Pago registrado · ${dateText(p.date)}</div></div><strong class="teal amount">${money(p.amount)}</strong></div>`}).join("")}</div>`:`<div class="empty">Los pagos registrados aparecerán aquí.</div>`}</section></div>`}
    function renderCalendar(){const events=openDebts().map(d=>({date:d.dueDate,name:d.name,amount:balance(d),label:daysUntil(d.dueDate)<0?"Vencido":"Vencimiento",cls:dueClass(d)})).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="heading"><div><h2>Fechas de pago</h2><p class="subtitle">Consulta vencimientos pendientes.</p></div></div><section class="card">${events.length?`<div class="list">${events.map(e=>`<div class="item"><div><div class="item-name">${esc(e.name)}</div><div class="item-info">${dateText(e.date)}</div></div><div class="item-actions"><span class="badge ${e.cls}">${e.label}</span><strong>${money(e.amount)}</strong></div></div>`).join("")}</div>`:`<div class="empty">No hay vencimientos. Agrega una deuda para verla aquí.</div>`}</section>`}
    function renderProfile(){return `<div class="heading"><div><h2>Perfil y ajustes</h2><p class="subtitle">Personaliza PayPlan y gestiona tus datos.</p></div></div><div class="columns"><section class="form-card"><h3>👤 Tu perfil</h3><form id="profileForm"><label>Nombre<input name="name" maxlength="50" value="${esc(name())}" placeholder="Ej. Eladio"></label><label>Moneda para mostrar<select name="currency">${["USD","VES","EUR","COP","MXN","ARS","CLP","PEN"].map(c=>`<option value="${c}" ${currency()===c?"selected":""}>${c}</option>`).join("")}</select></label><button class="primary">Guardar ajustes</button></form></section><section class="card"><h3>🔔 Recordatorios</h3><p class="muted">Solicita permiso para avisos el día del vencimiento y cinco días antes. El navegador revisa vencimientos mientras PayPlan está abierto; no garantiza avisos con la app cerrada.</p><button class="primary" data-notifications>Activar notificaciones</button><hr style="border:0;border-top:1px solid var(--line);margin:17px 0"><h3>Respaldo de datos</h3><p class="muted">Tus registros se guardan en este navegador. Exporta una copia para conservarlos o trasladarlos.</p><div class="actions"><button class="secondary" data-export>Descargar respaldo</button><button class="plain" data-import>Importar respaldo</button><input id="importFile" class="file-input" type="file" accept="application/json,.json"></div><p class="muted">Importar reemplaza los datos actuales. Haz un respaldo primero.</p></section></div>`}
    function renderHelp(){return `<div class="heading"><div><h2>Ayuda</h2><p class="subtitle">Todo lo esencial para empezar.</p></div></div><section class="card"><h3>Cómo usar PayPlan</h3><ol><li>En <strong>Deudas</strong>, registra cada saldo y fecha de vencimiento.</li><li>Revisa en <strong>Inicio</strong> el orden por fecha y tu progreso.</li><li>Cuando hayas pagado, regístralo en <strong>Pagos</strong> para actualizar el saldo.</li><li>En <strong>Perfil</strong>, configura el nombre, la moneda, recordatorios y respaldos.</li></ol><p class="muted">PayPlan guarda datos solo en este navegador; no hay cuenta ni sincronización. No transfiere dinero ni hace pagos. La guía de vencimientos no sustituye los términos de tus acreedores.</p><button class="danger" data-clear>Borrar todos mis datos</button></section>`}
    function checkReminders(){if(!("Notification" in window)||Notification.permission!=="granted")return;for(const d of openDebts()){const days=daysUntil(d.dueDate);if(days!==5&&days!==0)continue;const key=`payplan-reminder-${d.id}-${d.dueDate}-${days}`;if(localStorage.getItem(key))continue;try{new Notification("PayPlan: recordatorio",{body:days===0?`${d.name} vence hoy. Saldo: ${money(balance(d))}.`:`${d.name} vence en 5 días. Saldo: ${money(balance(d))}.`});localStorage.setItem(key,"sent")}catch{}}}
    function requestNotifications(){if(!("Notification" in window)){notifyToast("Este navegador no admite notificaciones.");return}Notification.requestPermission().then(p=>{notifyToast(p==="granted"?"Recordatorios activados.":"No se concedió permiso.");checkReminders()}).catch(()=>notifyToast("No se pudieron activar."))}
    function downloadBackup(){const blob=new Blob([JSON.stringify({app:"PayPlan",version:1,exportedAt:new Date().toISOString(),data},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`payplan-respaldo-${todayString()}.json`;a.click();URL.revokeObjectURL(url);notifyToast("Respaldo descargado.")}
    async function importBackup(file){try{const parsed=JSON.parse(await file.text());const incoming=parsed.data||parsed;if(!Array.isArray(incoming.debts)||!Array.isArray(incoming.payments))throw new Error("Formato inválido");const debtIds=new Set(incoming.debts.map(d=>d.id));if(incoming.debts.some(d=>!d.id||!d.name||!Number.isFinite(Number(d.amount))||Number(d.amount)<=0||!d.dueDate)||incoming.payments.some(p=>!p.id||!debtIds.has(p.debtId)||!Number.isFinite(Number(p.amount))||Number(p.amount)<=0))throw new Error("Datos no válidos");if(!confirm("Esto reemplazará las deudas y pagos actuales. ¿Continuar?"))return;data={debts:incoming.debts,payments:incoming.payments};saveData();render();notifyToast("Respaldo importado.")}catch{alert("No se pudo importar. Selecciona un respaldo JSON válido de PayPlan.")}}
    function render(){renderNav();const views={home:renderHome,debts:renderDebts,payments:renderPayments,calendar:renderCalendar,profile:renderProfile,help:renderHelp};document.getElementById("app").innerHTML=views[page]();document.getElementById("today").textContent=new Date().toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});checkReminders()}
    document.addEventListener("click",event=>{const tab=event.target.closest("[data-page]"),go=event.target.closest("[data-go]"),pay=event.target.closest("[data-pay]"),del=event.target.closest("[data-delete-debt]");if(tab){page=tab.dataset.page;selectedDebtId="";render();return}if(go){page=go.dataset.go;render();return}if(pay){selectedDebtId=pay.dataset.pay;page="payments";render();return}if(event.target.closest("[data-notifications]")){requestNotifications();return}if(event.target.closest("[data-export]")){downloadBackup();return}if(event.target.closest("[data-import]")){document.getElementById("importFile").click();return}if(del){const d=data.debts.find(x=>x.id===del.dataset.deleteDebt);if(d&&confirm(`¿Eliminar “${d.name}” y su historial de pagos?`)){data.debts=data.debts.filter(x=>x.id!==d.id);data.payments=data.payments.filter(x=>x.debtId!==d.id);saveData();render();notifyToast("Deuda eliminada.")}return}if(event.target.closest("[data-clear]")&&confirm("¿Borrar permanentemente todas tus deudas, pagos y nombre de perfil de este navegador?")){data={debts:[],payments:[]};localStorage.removeItem(DATA_KEY);localStorage.removeItem(NAME_KEY);saveData();page="home";render();notifyToast("Datos eliminados.")}});
    document.addEventListener("change",event=>{if(event.target.id==="importFile"&&event.target.files?.[0]){importBackup(event.target.files[0]);event.target.value=""}});
    document.addEventListener("submit",event=>{event.preventDefault();const form=event.target,v=Object.fromEntries(new FormData(form));if(form.id==="profileForm"){localStorage.setItem(NAME_KEY,(v.name||"").trim());localStorage.setItem(CURRENCY_KEY,v.currency||"USD");render();notifyToast("Perfil actualizado.");return}if(form.id==="debtForm"){const amount=Number(v.amount);if(!v.name.trim()||amount<=0||!v.dueDate){alert("Revisa el nombre, el monto y la fecha.");return}data.debts.push({id:makeId(),name:v.name.trim(),category:v.category,amount,dueDate:v.dueDate,note:(v.note||"").trim()});saveData();render();notifyToast("Deuda agregada.");return}if(form.id==="paymentForm"){const debt=data.debts.find(d=>d.id===v.debtId),amount=Number(v.amount);if(!debt||amount<=0||amount>balance(debt)){alert("El monto debe ser positivo y no superar el saldo pendiente.");return}if(!confirm(`¿Confirmas que ya realizaste el pago de ${money(amount)} para “${debt.name}”?`))return;data.payments.push({id:makeId(),debtId:debt.id,amount,date:v.date});saveData();selectedDebtId="";render();notifyToast(`Pago guardado. ¡Sumaste 10 puntos!`);return}});
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkReminders()});
    render();setInterval(checkReminders,60*60*1000);
    if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./service-worker.js").catch(error=>console.error("No se pudo registrar el service worker:",error)))}
  </script>
</body>
</html>
